name: Build iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择 Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: 安装 XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: 生成 Xcode 工程
        run: |
          xcodegen generate
          echo "=== 生成内容 ==="
          ls -la
          echo "=== scheme 列表 ==="
          xcodebuild -list -project FarDriver.xcodeproj || true

      - name: 编译（不签名）
        id: build
        run: |
          set -o pipefail
          xcodebuild build \
            -project FarDriver.xcodeproj \
            -scheme FarDriver \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            2>&1 | tee build.log | tail -100

      - name: 列出编译产物
        if: always()
        run: |
          echo "=== build 目录结构 ==="
          find build -name "*.app" -maxdepth 6 2>/dev/null || echo "没找到 .app"
          echo ""
          echo "=== Release-iphoneos 目录 ==="
          ls -la build/Build/Products/ 2>/dev/null || echo "Products 目录不存在"
          echo ""
          ls -la build/Build/Products/Release-iphoneos/ 2>/dev/null || echo "Release-iphoneos 不存在"

      - name: 保存编译日志
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: 打包成 ipa
        run: |
          set -e
          APP_PATH=$(find build -type d -name "FarDriver.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ 找不到 FarDriver.app"
            echo "=== 搜索所有 .app ==="
            find build -type d -name "*.app" || true
            exit 1
          fi
          echo "✅ 找到 App: $APP_PATH"
          echo "=== App 内容 ==="
          ls -la "$APP_PATH"
          du -sh "$APP_PATH"

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          echo "=== Payload 内容 ==="
          ls -la Payload/
          du -sh Payload/

          rm -f FarDriver-unsigned.ipa
          zip -r FarDriver-unsigned.ipa Payload
          echo "=== ipa 大小 ==="
          ls -lh FarDriver-unsigned.ipa

          SIZE=$(stat -f%z FarDriver-unsigned.ipa)
          echo "ipa 字节数: $SIZE"
          if [ "$SIZE" -lt 100000 ]; then
            echo "❌ ipa 太小了（$SIZE 字节），打包失败"
            exit 1
          fi
          echo "✅ ipa 正常"

      - name: 上传 ipa
        uses: actions/upload-artifact@v4
        with:
          name: FarDriver-ipa
          path: FarDriver-unsigned.ipa
          retention-days: 30
