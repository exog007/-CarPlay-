name: Build iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择 Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: 安装 XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: 生成 Xcode 工程
        run: |
          xcodegen generate
          ls -la
          xcodebuild -list -project FarDriver.xcodeproj || true

      - name: 编译（不签名）
        id: build
        run: |
          set +e
          xcodebuild build \
            -project FarDriver.xcodeproj \
            -scheme FarDriver \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            > build.log 2>&1
          RC=$?
          echo "退出码: $RC"

          # 提取错误，写进 artifact 名字（方便通过 API 读取）
          ERRS=$(grep -E "error:" build.log | sed 's/^[^:]*:[0-9]*:[0-9]*: //' | sed 's/[^a-zA-Z0-9 ]//g' | head -3 | tr ' ' '_' | tr '\n' '-')
          if [ -z "$ERRS" ]; then ERRS="no-error-lines"; fi
          # artifact 名字限制 256 字符，截断
          ERRS=$(echo "$ERRS" | cut -c1-120)
          echo "ERROR_SUMMARY=$ERRS" >> $GITHUB_ENV

          # 也把前 20 条错误打到日志（肯定能看到的部分）
          echo "=== 前 20 条错误 ==="
          grep -E "error:" build.log | head -20 || echo "(没有 error: 行)"
          echo ""
          echo "=== 日志最后 120 行 ==="
          tail -120 build.log

          if [ $RC -ne 0 ]; then
            echo "编译失败"
            exit 1
          fi

      - name: 保存日志-失败
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: err-${{ env.ERROR_SUMMARY }}
          path: build.log
          retention-days: 7

      - name: 打包成 ipa
        if: success()
        run: |
          set -e
          APP_PATH=$(find build -type d -name "FarDriver.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "找不到 FarDriver.app"
            find build -type d -name "*.app" || true
            exit 1
          fi
          echo "找到: $APP_PATH"
          ls -la "$APP_PATH"
          rm -rf Payload; mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          rm -f FarDriver-unsigned.ipa
          zip -r FarDriver-unsigned.ipa Payload
          ls -lh FarDriver-unsigned.ipa
          SIZE=$(stat -f%z FarDriver-unsigned.ipa)
          echo "ipa: $SIZE bytes"
          [ "$SIZE" -gt 100000 ] || { echo "ipa 太小"; exit 1; }

      - name: 上传 ipa
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FarDriver-ipa-OK
          path: FarDriver-unsigned.ipa
          retention-days: 30
