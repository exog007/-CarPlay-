name: Build iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择 Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: 安装 XcodeGen
        run: |
          brew install xcodegen

      - name: 下载高德地图 SDK
        run: |
          set -e
          mkdir -p vendor/amap
          echo "下载 3D 地图库（约 63MB）..."
          curl -L --retry 4 --retry-delay 5 --max-time 600 \
            -o /tmp/map.zip \
            "https://a.amap.com/lbs/static/zip/AMap_iOS_3DMap_Lib_V11.2.100.zip"
          echo "下载基础库（约 1MB）..."
          curl -L --retry 4 --retry-delay 5 --max-time 300 \
            -o /tmp/found.zip \
            "https://amappc.oss-cn-zhangjiakou.aliyuncs.com/lbs/static/zip/AMap_iOS_Foundation_Lib_V1.9.1.zip"
          unzip -q /tmp/map.zip -d vendor/amap
          unzip -q /tmp/found.zip -d vendor/amap
          echo "=== vendor/amap 内容 ==="
          ls -la vendor/amap
          test -d vendor/amap/MAMapKit.framework || { echo "缺少 MAMapKit.framework"; exit 1; }
          test -d vendor/amap/AMapFoundationKit.framework || { echo "缺少 AMapFoundationKit.framework"; exit 1; }

      - name: 生成 Xcode 工程
        run: |
          xcodegen generate
          xcodebuild -list -project FarDriver.xcodeproj || true

      - name: 编译（不签名）
        id: build
        run: |
          set +e
          xcodebuild build \
            -project FarDriver.xcodeproj \
            -scheme FarDriver \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            > build.log 2>&1
          RC=$?

          echo "=== 退出码: $RC ==="
          echo ""
          echo "=== 完整错误（带文件行号）==="
          grep -E "error:" build.log | head -30
          echo ""
          echo "=== 错误所在文件汇总 ==="
          grep -E "error:" build.log | sed -n 's/^\([^:]*\.swift\):\([0-9]*\):\([0-9]*\): error:.*/\1:\2/p' | sort -u | head -20

          # 把第一个错误的「文件:行号」写进 artifact 名
          FIRST=$(grep -E "error:" build.log | head -1)
          LOC=$(echo "$FIRST" | sed -n 's/^\(.*\.swift:[0-9]*:[0-9]*\).*/\1/p')
          if [ -z "$LOC" ]; then LOC="unknown-location"; fi
          LOC=$(echo "$LOC" | sed 's#.*/##' | tr ':' '-' | cut -c1-60)
          echo "ERROR_LOC=$LOC" >> $GITHUB_ENV

          if [ $RC -ne 0 ]; then exit 1; fi

      - name: 保存日志-失败
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: err-${{ env.ERROR_LOC }}
          path: build.log
          retention-days: 7

      - name: 打包成 ipa
        if: success()
        run: |
          set -e
          APP_PATH=$(find build -type d -name "FarDriver.app" | head -1)
          [ -n "$APP_PATH" ] || { echo "找不到 app"; exit 1; }
          echo "找到: $APP_PATH"
          rm -rf Payload; mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          rm -f FarDriver-unsigned.ipa
          zip -r FarDriver-unsigned.ipa Payload
          ls -lh FarDriver-unsigned.ipa
          SIZE=$(stat -f%z FarDriver-unsigned.ipa)
          echo "ipa: $SIZE bytes"
          [ "$SIZE" -gt 100000 ] || { echo "ipa 太小"; exit 1; }

      - name: 上传 ipa
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FarDriver-ipa-OK
          path: FarDriver-unsigned.ipa
          retention-days: 30
