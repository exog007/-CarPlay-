name: FarDriver
options:
  bundleIdPrefix: com.exog007
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: "NO"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"

targets:
  FarDriver:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FarDriver
        excludes:
          - "Info.plist"
          - "FarDriver.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.exog007.fardriver
        INFOPLIST_FILE: FarDriver/Info.plist
        PRODUCT_NAME: FarDriver
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 高德 SDK 需要的链接参数
        # ⚠️ -ObjC 必须有：MAMapKit 是静态框架，它依赖很多 Objective-C 分类
        #   （NSValue 坐标转换、NSString 扩展等）。不加 -ObjC 这些分类不会被链接进来，
        #   结果是地图一片黑/空白，而且不报任何错误。
        OTHER_LDFLAGS: "$(inherited) -ObjC -lz -lc++"
        # 让 Xcode 能找到 vendor 目录里的 framework
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/vendor/amap"
    dependencies:
      - target: FarDriverWidgetExtension
        embed: true
      # ── 高德地图 SDK（由 CI 在构建前下载到 vendor/amap）──
      - framework: vendor/amap/MAMapKit.framework
        embed: true
        codeSign: false
      - framework: vendor/amap/AMapFoundationKit.framework
        embed: true
        codeSign: false
      # 高德 SDK 依赖的系统框架
      - sdk: QuartzCore.framework
      - sdk: SystemConfiguration.framework
      - sdk: CoreTelephony.framework
      - sdk: Security.framework
      - sdk: OpenGLES.framework
      - sdk: CoreText.framework
      - sdk: CoreGraphics.framework
      - sdk: GLKit.framework
      - sdk: libz.tbd
      - sdk: libc++.tbd
    entitlements:
      path: FarDriver/FarDriver.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.exog007.fardriver

  FarDriverWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FarDriverWidget
        excludes:
          - "Info.plist"
          - "FarDriverWidget.entitlements"
      - path: FarDriver/FarDriverProtocol.swift
      - path: FarDriver/SharedStore.swift
      - path: FarDriver/FarDriverAttributes.swift
      - path: FarDriver/WarningIcons.swift
      - path: FarDriver/FarDriverFaultCodes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.exog007.fardriver.widget
        INFOPLIST_FILE: FarDriverWidget/Info.plist
        PRODUCT_NAME: FarDriverWidget
        SKIP_INSTALL: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
    entitlements:
      path: FarDriverWidget/FarDriverWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.exog007.fardriver
