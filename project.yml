name: FarDriver
options:
  bundleIdPrefix: com.exog007
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  FarDriver:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FarDriver
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.exog007.fardriver
        INFOPLIST_FILE: FarDriver/Info.plist
        PRODUCT_NAME: FarDriver
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_BITCODE: "NO"
        SUPPORTS_MACCATALYST: "NO"
    dependencies:
      - target: FarDriverWidgetExtension
        embed: true
    entitlements:
      path: FarDriver/FarDriver.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.exog007.fardriver

  FarDriverWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FarDriverWidget
      - path: FarDriver/FarDriverProtocol.swift
      - path: FarDriver/SharedStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.exog007.fardriver.widget
        INFOPLIST_FILE: FarDriverWidget/Info.plist
        PRODUCT_NAME: FarDriverWidget
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: "YES"
        ENABLE_BITCODE: "NO"
    entitlements:
      path: FarDriverWidget/FarDriverWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.exog007.fardriver
