name: FarDriver
options:
  bundleIdPrefix: com.exog007
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: "NO"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"

targets:
  FarDriver:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FarDriver
        excludes:
          - "Info.plist"
          - "FarDriver.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.exog007.fardriver
        INFOPLIST_FILE: FarDriver/Info.plist
        PRODUCT_NAME: FarDriver
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: FarDriverWidgetExtension
        embed: true
    entitlements:
      path: FarDriver/FarDriver.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.exog007.fardriver

  FarDriverWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FarDriverWidget
        excludes:
          - "Info.plist"
          - "FarDriverWidget.entitlements"
      - path: FarDriver/FarDriverProtocol.swift
      - path: FarDriver/SharedStore.swift
      - path: FarDriver/FarDriverAttributes.swift
      - path: FarDriver/WarningIcons.swift
      - path: FarDriver/FarDriverFaultCodes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.exog007.fardriver.widget
        INFOPLIST_FILE: FarDriverWidget/Info.plist
        PRODUCT_NAME: FarDriverWidget
        SKIP_INSTALL: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
    entitlements:
      path: FarDriverWidget/FarDriverWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.exog007.fardriver
